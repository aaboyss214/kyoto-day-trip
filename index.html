
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오사카 3일 여행 지도</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,"Malgun Gothic",sans-serif;color:#293d36;background:#f8f6f0}
header{padding:25px max(18px,calc((100vw - 1100px)/2));background:#fff;border-bottom:1px solid #e5e5dc}
h1{margin:0 0 7px}
h2{margin:0 0 12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;cursor:pointer;border:1px solid #c9d9cb;border-radius:10px;background:#fff;color:#367056;padding:8px 12px}
button.on{background:#367056;color:#fff}
main{max-width:1100px;margin:auto;padding:16px}
.notice{padding:13px;border-radius:12px;background:#fff6e5;margin-bottom:16px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.panel{min-width:0;background:#fff;border:1px solid #e4e9e1;border-radius:16px;padding:17px}
.line{padding:12px 0;border-bottom:1px solid #e9efe8;display:flex;gap:11px}
.line input[type=checkbox]{accent-color:#367056;margin-top:7px}
.time{color:#bd756e;font-size:12px;font-weight:800}
.name{font-weight:800}
.meta{font-size:12px;color:#687970}
.map{width:100%;height:400px;border:0;border-radius:12px;background:#e6ece7}
.btn{color:#367056;text-decoration:none;font-size:12px;display:inline-block;border:1px solid #d6e2d8;border-radius:8px;padding:6px 8px;margin:5px 5px 5px 0}
.meal{padding:8px;border:1px solid #bcd4c4;border-radius:8px;width:100%;max-width:260px}
@media(max-width:760px){
.layout{grid-template-columns:1fr}
.mapbox{grid-row:1}
.map{height:300px}
}
</style>
</head>
<body>
<header>
<h1>🌸 오사카 3일 여행 지도</h1>
<div class="meta">프리미어 호텔 CABIN PRESIDENT 오사카 · 관광 일정과 지도</div>
<nav>
<button data-day="1" class="on">🍣 1일 차 우메다</button>
<button data-day="2">🎢 2일 차 USJ</button>
<button data-day="3">⛩️ 3일 차 교토</button>
</nav>
</header>
<main>
<div id="notice" class="notice"></div>
<div class="layout">
<section class="panel">
<h2 id="heading"></h2>
<p id="progress" class="meta"></p>
<div id="list"></div>
</section>
<section class="panel mapbox">
<h2>🗺️ 선택한 장소</h2>
<div id="selected" class="meta"></div>
<iframe id="map" class="map" loading="lazy" title="관광지 지도"></iframe>
<div>
<a class="btn" id="gm" target="_blank" rel="noopener">구글 지도에서 보기 ↗</a>
<a class="btn" id="route" target="_blank" rel="noopener">호텔에서 길찾기 ↗</a>
</div>
<p class="meta">지도가 안 보이면 위의 구글 지도 버튼을 사용해 주세요.</p>
</section>
</div>
</main>
<script>
const H='Premier Hotel CABIN PRESIDENT Osaka';
const data={
1:[
['12:00','한국에서 출발',''],
['14:00','간사이공항 도착','Kansai International Airport Terminal 1'],
['15:05','551 호라이','551 Horai Kansai Airport'],
['15:35','우메다행 공항버스','Kansai Airport Bus Terminal 1'],
['16:40','우메다 도착','Hankyu Sanbangai Osaka'],
['16:55','스시사카바 사시스','すし酒場さしす ホワイティうめだ店'],
['17:50','잇신도 과일 다이후쿠','一心堂 阪急うめだ本店'],
['18:05','호텔로 이동','Minamimorimachi Station'],
['18:25','프리미어 호텔 캐빈 체크인',H],
['18:45','호텔에서 우메다 복귀','Higashi Umeda Station'],
['19:05','치이카와랜드','Chiikawa Land Osaka Umeda'],
['19:35','스탠다드 프로덕트 EST','Standard Products Umeda EST'],
['20:00','HEP FIVE 점프샵','JUMP SHOP HEP FIVE Osaka'],
['20:20','HEP FIVE 스투시 (선택)','Stussy HEP FIVE Osaka'],
['20:40','매지컬 치이카와 B1','Magical Chiikawa HEP FIVE Osaka'],
['21:15','야키니쿠 리키마루','焼肉力丸 梅田お初天神店'],
['22:35','돈키호테 (선택)','Don Quijote Umeda Osaka'],
['23:15','편의점 → 호텔 복귀',H]
],
2:[],
3:[
['11:00','호텔 출발',H],
['11:00~12:15','아라시야마 이동','Hankyu Arashiyama Station'],
['12:15','도게츠교','Togetsukyo Bridge Kyoto'],
['12:40','점심 및 상점가','Arashiyama Kyoto'],
['13:15','덴류지','Tenryuji Kyoto'],
['13:55','치쿠린 대나무숲','Arashiyama Bamboo Forest Kyoto'],
['14:30','청수사로 이동','Kiyomizu dera Kyoto'],
['15:50','기요미즈데라(청수사)','Kiyomizu dera Kyoto'],
['16:40','산넨자카','Sannenzaka Kyoto'],
['17:05','야사카의 탑','Yasaka Pagoda Kyoto'],
['17:20','니넨자카','Ninenzaka Kyoto'],
['18:05','저녁 식사 (장소 미정)',''],
['19:00','후시미이나리로 이동','Fushimi Inari Taisha Kyoto'],
['19:45','후시미 이나리 신사 (야간)','Fushimi Inari Taisha Kyoto'],
['20:20','호텔 복귀 이동','Minamimorimachi Station Osaka'],
['21:30','호텔 도착',H]
]
};
let day=1;
const $=x=>document.getElementById(x);
const store={
get(k){try{return localStorage.getItem(k)}catch(e){return null}},
put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
function maps(q){
return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)
}
function selectPlace(q){
$('selected').textContent=q;
$('gm').href=maps(q);
$('route').href='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(H)+'&destination='+encodeURIComponent(q)+'&travelmode=transit';
$('map').src='https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=14&output=embed'
}
function progress(){
let count=0;
data[day].forEach((v,i)=>{
if(store.get('trip-'+day+'-'+i)==='1')count++
});
$('progress').textContent=data[day].length?count+' / '+data[day].length+' 완료':''
}
function show(n){
day=n;
document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('on',b.dataset.day==n));
$('heading').textContent=n===1?'1일 차 · 우메다':n===2?'2일 차 · 유니버설':'3일 차 · 교토';
$('notice').textContent=n===1?'공항 → 스시 → 잇신도 → 호텔 체크인 → 굿즈 쇼핑 → 저녁 → 호텔':n===2?'유니버설 스튜디오 재팬 방문. 세부 일정은 요청대로 비워두었습니다.':'11시 호텔 출발 → 아라시야마 → 청수사 → 산넨자카·니넨자카 → 저녁(장소 미정) → 후시미 이나리 → 호텔';
$('list').replaceChildren();
if(n===2){
$('list').textContent='🎢 유니버설 방문 · 세부 일정 비워둠';
selectPlace('Universal Studios Japan');
progress();
return
}
data[n].forEach((v,i)=>{
let row=document.createElement('div');
row.className='line';
let cb=document.createElement('input');
cb.type='checkbox';
cb.checked=store.get('trip-'+n+'-'+i)==='1';
cb.onchange=()=>{
store.put('trip-'+n+'-'+i,cb.checked?'1':'0');
progress()
};
let body=document.createElement('div');
let t=document.createElement('div');
t.className='time';
t.textContent=v[0];
let name=document.createElement('div');
name.className='name';
name.textContent=v[1];
body.append(t,name);
if(v[2]){
let b=document.createElement('button');
b.textContent='📍 지도 보기';
b.onclick=()=>selectPlace(v[2]);
body.append(b)
}
if(n===3&&i===11){
let inp=document.createElement('input');
inp.className='meal';
inp.placeholder='저녁 식당·장소 (빈칸)';
inp.value=store.get('trip-dinner')||'';
inp.oninput=()=>store.put('trip-dinner',inp.value);
body.append(inp)
}
row.append(cb,body);
$('list').append(row)
});
selectPlace(n===1?'HEP FIVE Osaka':'Arashiyama Kyoto');
progress()
}
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>show(Number(b.dataset.day)));
show(1);
</script>
</body>
</html>
